name: Hurst Supertrend Generator Test
description: Test strategy generation targeting the new Hurst Exponent Adaptive Supertrend indicator
trading_styles:
- intraday
style_overrides:
  intraday:
    max_hold_bars: 75
    forced_exit_time: '15:15'
    product_type: MIS
    min_trades: 50
data:
  openalgo:
    host: http://127.0.0.1:5000
    api_key: ${OPENALGO_API_KEY}
    source: db
  symbols:
  - symbol: BANKNIFTY
    exchange: NSE_INDEX
  timeframes:
  - 5m
  - 15m
  start_date: '2023-01-01'
  end_date: '2026-06-01'
  train_pct: 0.7
  validation_pct: 0.15
  test_pct: 0.15
generation:
  mode: guided
  target_count: 500
  max_conditions_per_entry: 3
  allow_short: true
  indicator_categories:
  - trend   # This ensures the generator pulls from the category containing HURST_SUPERTREND
  multi_timeframe: false
filters:
  fast_reject:
    max_complexity: 4
    min_indicators: 1
  backtest:
    min_trades: 50
    min_sharpe: 1.0
    max_drawdown: 0.20
    min_profit_factor: 1.2
